# CircleCI configuration
#
# Note: GitHub Actions (.github/workflows/ci.yml) runs the same suite on
# pushes and pull requests; this file keeps the CircleCI integration that
# posts coverage to Coveralls.
---
version: 2.1

workflows:
  version: 2
  multi-test:
    jobs:
      - node-v20
      - node-v22
      - node-v24
      - coverage

jobs:
  node-base: &node-base
    working_directory: ~/repo
    steps:
      - run: node --version
      - checkout
      - restore_cache:
          keys:
            - v2-dependencies-{{ checksum "package-lock.json" }}-{{ .Environment.CIRCLE_JOB }}
      - run: npm ci
      - save_cache:
          paths:
            - node_modules
          key: v2-dependencies-{{ checksum "package-lock.json" }}-{{ .Environment.CIRCLE_JOB }}
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  node-v20:
    <<: *node-base
    docker:
      - image: cimg/node:20.19
  node-v22:
    <<: *node-base
    docker:
      - image: cimg/node:22.18
  node-v24:
    <<: *node-base
    docker:
      - image: cimg/node:24.3

  coverage:
    working_directory: ~/repo
    docker:
      - image: cimg/node:20.19
    steps:
      - run: node --version
      - checkout
      - restore_cache:
          keys:
            - v2-dependencies-{{ checksum "package-lock.json" }}-{{ .Environment.CIRCLE_JOB }}
      - run: npm ci
      - run: npm run coverage
      - run: npm run report-coverage
