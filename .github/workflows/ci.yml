name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run typecheck

      - name: Run lint
        run: npm run lint

      - name: Check zero comments
        run: npm run check:no-comments

      - name: Run tests
        run: npm test

  build:
    # tsdown requires Node >=22.18; the published package still supports 18+.
    name: Build + package lint (Node 26)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build

      - name: Lint package (publint + attw)
        run: npm run lint:pkg

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run coverage
        run: npm run coverage

      - name: Generate badge JSON
        run: |
          node -e "
            const pct = require('./coverage/coverage-summary.json').total.lines.pct
            const color =
              pct >= 90 ? 'brightgreen'
              : pct >= 80 ? 'green'
              : pct >= 70 ? 'yellowgreen'
              : pct >= 60 ? 'yellow'
              : pct >= 50 ? 'orange'
              : 'red'
            const badge = { schemaVersion: 1, label: 'coverage', message: pct + '%', color }
            require('fs').writeFileSync('coverage-badge.json', JSON.stringify(badge))
            console.log('coverage badge:', JSON.stringify(badge))
          "

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/
            coverage-badge.json

      - name: Publish badge to badges branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          mkdir -p "$RUNNER_TEMP/badge"
          cp coverage-badge.json "$RUNNER_TEMP/badge/"
          cd "$RUNNER_TEMP/badge"
          git init -q
          git checkout -q --orphan badges
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add coverage-badge.json
          git commit -q -m "coverage badge"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" badges
