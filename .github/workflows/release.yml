name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Check tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Check npm supports trusted publishing
        run: |
          node -e "
            const [major, minor, patch] = process.argv[1].split('.').map(Number)
            const n = major * 1e6 + minor * 1e3 + patch
            if (n < 11005001) {
              console.error('npm ' + process.argv[1] + ' is too old for trusted publishing (needs 11.5.1+)')
              process.exit(1)
            }
          " "$(npm --version)"

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: |
          npm run typecheck
          npm run lint
          npm run check:no-comments
          npm test

      - name: Build
        run: npm run build

      - name: Lint package (publint + attw)
        run: npm run lint:pkg

      - name: Publish
        run: npm publish
